plugins {
    id 'net.neoforged.moddev'
    id 'multiloader-loader'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        // Add a second client run that is authenticated
        clientAuth {
            client()
            devLogin = true
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = "https://maven.su5ed.dev/releases"
    }
}

dependencies {
    jarJar(api("gg.moonflower:molang-compiler:$molang_compiler_version"))
    jarJar(api("io.github.ocelot:glsl-processor:${glsl_processor_version}"))

    compileOnly "foundry.imguimc:imguimc-neoforge-${minecraft_version}:$imguimc_version"

    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_version}"
    compileOnly "maven.modrinth:iris:1.10.7+1.21.11-neoforge"
//    compileOnly "maven.modrinth:tacz-1.21.1:1.1.7-hotfix-r3"
//    runtimeOnly "net.caffeinemc:sodium-neoforge:${sodium_version}"
//    runtimeOnly "maven.modrinth:iris:1.10.7+1.21.11-neoforge"
//    runtimeOnly "maven.modrinth:tacz-1.21.1:1.1.7-hotfix-r3"

}
